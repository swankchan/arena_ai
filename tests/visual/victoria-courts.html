<script type="module">
import * as THREE from 'three/webgpu';
import { buildVictoriaPark } from '../../js/cities/hongkong/victoria-park-world.js';
import { cityUniforms } from '../../js/tsl-materials.js';
import { VICTORIA_PARK, majorParkLocalToWorld } from '../../js/cities/hongkong/major-parks-architecture.js';
const scene = new THREE.Scene();
const { root, update } = buildVictoriaPark(scene);
const night = new URLSearchParams(location.search).has('night');
cityUniforms.uInteriorGlow.value = night ? 1.4 : 0; update();
scene.add(new THREE.HemisphereLight(0xffffff, 0x909090, night ? .25 : 1));
const sun = new THREE.DirectionalLight(0xffffff, night ? .1 : 2); sun.position.set(100, 300, 100); scene.add(sun);
const camera = new THREE.OrthographicCamera(-220, 220, 220, -220, .1, 1000);
camera.position.set(3050, 500, -30); camera.up.set(0, 0, -1); camera.lookAt(3050, 0, -30); camera.updateMatrixWorld();
const renderer = new THREE.WebGPURenderer({ forceWebGL: true, antialias: false });
await renderer.init(); renderer.setSize(1760, 1760);
const target = new THREE.RenderTarget(1760, 1760); renderer.setRenderTarget(target); renderer.render(scene, camera);
const pixels = await renderer.readRenderTargetPixelsAsync(target, 0, 0, 1760, 1760);
const failures = [], samples = [];
for (const f of VICTORIA_PARK.features.filter(f => ['soccer', 'tennis', 'centreCourt'].includes(f.kind))) {
  // Away from lines and net. Multiple samples detect occlusion without relying on a single pixel.
  const checks = [];
  for (const [x,z] of [[-2,3],[2,3],[-2,-3],[2,-3]]) {
    const p = majorParkLocalToWorld(f.site, x, z);
    const v = new THREE.Vector3(p.x, 0, p.z).project(camera);
    const px = Math.floor((v.x + 1) * 880), py = Math.floor((v.y + 1) * 880);
    const i = (py * 1760 + px) * 4, rgb = Array.from(pixels.slice(i, i + 3));
    const [r,g,b] = rgb;
    checks.push({ rgb, ok: f.kind === 'soccer' ? g > r * 1.25 && g > b * 1.1 : b > r * 1.3 && b > g * 1.1 });
  }
  samples.push({ name: f.name, kind: f.kind, checks });
  if (checks.filter(c => c.ok).length < 3) failures.push(f.name);
}
window.results = { failures, samples }; document.body.textContent = JSON.stringify(window.results, null, 2);
</script>
