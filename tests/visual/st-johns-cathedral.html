<script type="importmap">{"imports":{"three":"../../vendor/three/build/three.webgpu.js","three/webgpu":"../../vendor/three/build/three.webgpu.js","three/tsl":"../../vendor/three/build/three.tsl.js","three/addons/":"../../vendor/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three/webgpu';
import {cityUniforms} from '../../js/tsl-materials.js';
import {buildStJohnsCathedral} from '../../js/cities/hongkong/st-johns-cathedral-world.js';
import {ST_JOHNS_CATHEDRAL_SITE as S} from '../../js/cities/hongkong/st-johns-cathedral-site.js';
import {hongKongTerrainHeight as h} from '../../js/cities/hongkong/terrain.js';

const night = new URLSearchParams(location.search).has('night');
cityUniforms.uInteriorGlow.value = night ? 1.4 : 0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? 0x17202c : 0xb3c4d0);

buildStJohnsCathedral(scene);

const verts = [];
for (let x = S.x - 70; x < S.x + 70; x += 3) {
  for (let z = S.z - 70; z < S.z + 70; z += 3) {
    for (let [a, b] of [[x, z], [x, z + 3], [x + 3, z], [x + 3, z], [x, z + 3], [x + 3, z + 3]]) {
      verts.push(a, h(a, b) - 0.05, b);
    }
  }
}
let g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
g.computeVertexNormals();
scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: 0x6d786e, side: THREE.DoubleSide})));

scene.add(new THREE.HemisphereLight(0xffffff, 0x68776e, night ? 0.25 : 1.1));
let sun = new THREE.DirectionalLight(0xffffff, night ? 0.1 : 2);
sun.position.set(S.x + 50, 150, S.z - 60);
scene.add(sun);

let camera = new THREE.PerspectiveCamera(42, 1.6, 0.1, 1000);
camera.position.set(S.x - 45, 52, S.z - 45);
camera.lookAt(S.x, 32, S.z);

let renderer = new THREE.WebGPURenderer({forceWebGL: true, antialias: true});
await renderer.init();
renderer.setSize(1280, 800);
document.body.appendChild(renderer.domElement);
renderer.render(scene, camera);
window.ready = true;
</script>
