<!doctype html><meta charset="utf-8">
<title>聖約翰座堂 St. John's Cathedral (Declared Monument) Visual Test</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #ui {
    position: absolute; top: 12px; left: 12px; color: #f5f3ef;
    background: rgba(22, 26, 30, 0.88); backdrop-filter: blur(8px);
    padding: 14px 18px; border-radius: 8px; z-index: 10; line-height: 1.55;
    border: 1px solid rgba(255,255,255,0.15); max-width: 480px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #ui h1 { margin: 0 0 6px; font-size: 16px; color: #f0dfb2; letter-spacing: 0.5px; }
  #ui p { margin: 4px 0; font-size: 12.5px; color: #d0c8b8; }
  #ui .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  #ui .tag { background: rgba(212, 175, 55, 0.2); color: #ecd696; border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 4px; padding: 2px 7px; font-size: 11px; }
  #controls {
    position: absolute; bottom: 12px; left: 12px; color: #bbb;
    background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 6px; font-size: 11px; z-index: 10;
  }
</style>
<div id="ui">
  <h1>聖約翰座堂 St. John's Cathedral</h1>
  <p><b>香港一級法定古蹟 (Declared Monument 1996)</b> | 1849 年開堂 / 1873 年擴建</p>
  <p>香港及遠東現存歷史最悠久的聖公會西式教堂建築，位於中環花園道 4-8 號。</p>
  <div class="tags">
    <span class="tag">13世紀英倫哥特復興式</span>
    <span class="tag">西鐘樓 & VR 女王徽記</span>
    <span class="tag">雉堞式城垛 & 四角尖頂十字架</span>
    <span class="tag">雙聯石花櫺彩繪玻璃窗</span>
    <span class="tag">一戰陣亡將士紀念十字碑</span>
    <span class="tag">維多利亞鑄鐵煤氣燈</span>
  </div>
</div>
<div id="controls">
  滑鼠左鍵拖曳旋轉視角 | 滾輪縮放 | <a href="?night" style="color:#f0dfb2">夜景模式</a> / <a href="?" style="color:#f0dfb2">日景模式</a>
</div>

<script type="importmap">{"imports":{"three":"../../vendor/three/build/three.webgpu.js","three/webgpu":"../../vendor/three/build/three.webgpu.js","three/tsl":"../../vendor/three/build/three.tsl.js","three/addons/":"../../vendor/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three/webgpu';
import {cityUniforms} from '../../js/tsl-materials.js';
import {buildStJohnsCathedral} from '../../js/cities/hongkong/st-johns-cathedral-world.js';
import {ST_JOHNS_CATHEDRAL_SITE as S} from '../../js/cities/hongkong/st-johns-cathedral-site.js';
import {hongKongTerrainHeight as h} from '../../js/cities/hongkong/terrain.js';

const night = new URLSearchParams(location.search).has('night');
cityUniforms.uInteriorGlow.value = night ? 1.5 : 0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? 0x111822 : 0xc6d7e2);

buildStJohnsCathedral(scene);

// Terrain mesh
const verts = [];
for (let x = S.x - 70; x < S.x + 70; x += 3) {
  for (let z = S.z - 70; z < S.z + 70; z += 3) {
    for (let [a, b] of [[x, z], [x, z + 3], [x + 3, z], [x + 3, z], [x, z + 3], [x + 3, z + 3]]) {
      verts.push(a, h(a, b) - 0.05, b);
    }
  }
}
let g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
g.computeVertexNormals();
scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: 0x5a685b, side: THREE.DoubleSide})));

scene.add(new THREE.HemisphereLight(0xfff7e6, 0x556357, night ? 0.3 : 1.15));
let sun = new THREE.DirectionalLight(0xfff5e4, night ? 0.15 : 2.1);
sun.position.set(S.x - 50, 140, S.z - 70);
scene.add(sun);

if (night) {
  // Cathedral nighttime architectural accent lighting
  const towerAccent = new THREE.PointLight(0xffd588, 3.5, 45, 1.2);
  towerAccent.position.set(S.x - 22, 38, S.z + 2);
  scene.add(towerAccent);

  const gardenAccent = new THREE.PointLight(0xffe8a0, 2.0, 30, 1.1);
  gardenAccent.position.set(S.x - 29, 28, S.z - 4);
  scene.add(gardenAccent);
}

let camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.2, 1000);
const target = new THREE.Vector3(S.x - 5, 30, S.z);
let radius = 68, phi = Math.PI / 4.8, theta = -Math.PI / 2.8;

function updateCamera() {
  camera.position.set(
    target.x + radius * Math.sin(phi) * Math.sin(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(target);
}
updateCamera();

let isDragging = false, prevMouseX = 0, prevMouseY = 0;
window.addEventListener('mousedown', (e) => {
  if (e.target.tagName === 'A') return;
  isDragging = true;
  prevMouseX = e.clientX;
  prevMouseY = e.clientY;
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouseX;
  const dy = e.clientY - prevMouseY;
  prevMouseX = e.clientX;
  prevMouseY = e.clientY;
  theta -= dx * 0.007;
  phi = Math.max(0.1, Math.min(Math.PI / 2.05, phi - dy * 0.007));
  updateCamera();
});
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('wheel', (e) => {
  radius = Math.max(15, Math.min(160, radius + e.deltaY * 0.05));
  updateCamera();
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let renderer = new THREE.WebGPURenderer({forceWebGL: true, antialias: true});
await renderer.init();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
window.ready = true;
</script>
