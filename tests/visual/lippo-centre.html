<!doctype html><meta charset="utf-8">
<title>力寶中心一期同二期 Lippo Centre Towers 1 & 2 Visual Test</title>
<style>body{margin:0;overflow:hidden;background:#111}#ui{position:absolute;top:10px;left:10px;color:#fff;font-family:sans-serif;background:rgba(0,0,0,0.75);padding:10px 16px;border-radius:6px;z-index:10;line-height:1.5}a{color:#8bd;text-decoration:none}</style>
<div id="ui">
  <b>力寶中心一期同二期 Lippo Centre Towers 1 & 2</b> (1988, 89 Queensway, Admiralty)<br>
  Architect: Paul Rudolph (保羅·魯道夫) | "The Koala Tree" (樹熊大廈)<br>
  Tower 1 (172m, 45 storeys) | Tower 2 (186m, 48 storeys) | Cantilevered Faceted Pods | Skybridges
</div>
<script type="importmap">{"imports":{"three":"../../vendor/three/build/three.webgpu.js","three/webgpu":"../../vendor/three/build/three.webgpu.js","three/tsl":"../../vendor/three/build/three.tsl.js","three/addons/":"../../vendor/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three/webgpu';
import { cityUniforms } from '../../js/tsl-materials.js';
import { buildLippoCentre } from '../../js/cities/hongkong/lippo-centre-world.js';
import { LIPPO_PODIUM_DATA as P, LIPPO_TOWER_ONE_DATA as T1, LIPPO_TOWER_TWO_DATA as T2 } from '../../js/cities/hongkong/lippo-centre-site.js';
import { hongKongTerrainHeight as h } from '../../js/cities/hongkong/terrain.js';

const night = new URLSearchParams(location.search).has('night');
cityUniforms.uInteriorGlow.value = night ? 1.4 : 0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? 0x0c131d : 0xcfe0ed);

buildLippoCentre(scene);

// Surroundings terrain patch
const verts = [];
for (let x = P.center.x - 70; x < P.center.x + 70; x += 4) {
  for (let z = P.center.z - 70; z < P.center.z + 70; z += 4) {
    for (let [a, b] of [[x, z], [x, z + 4], [x + 4, z], [x + 4, z], [x, z + 4], [x + 4, z + 4]]) {
      verts.push(a, h(a, b) - 0.05, b);
    }
  }
}
let g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
g.computeVertexNormals();
scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x5a6358, side: THREE.DoubleSide })));

scene.add(new THREE.HemisphereLight(0xffffff, 0x556655, night ? 0.35 : 1.15));
let sun = new THREE.DirectionalLight(0xffffff, night ? 0.15 : 2.2);
sun.position.set(P.center.x + 120, 260, P.center.z - 120);
scene.add(sun);

let camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 1000);
// Elevated perspective viewing both twin towers from Queensway looking northwest
camera.position.set(P.center.x + 90, 85, P.center.z + 95);
camera.lookAt(P.center.x, 80, P.center.z);

let renderer = new THREE.WebGPURenderer({ forceWebGL: true, antialias: true });
await renderer.init();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
window.ready = true;
</script>
