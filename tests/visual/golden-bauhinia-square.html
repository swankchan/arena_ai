<script type="importmap">{"imports":{"three":"../../vendor/three/build/three.webgpu.js","three/webgpu":"../../vendor/three/build/three.webgpu.js","three/tsl":"../../vendor/three/build/three.tsl.js","three/addons/":"../../vendor/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three/webgpu';
import { cityUniforms } from '../../js/tsl-materials.js';
import { buildHkcec } from '../../js/cities/hongkong/hkcec-world.js';
import { HKCEC_GOLDEN_BAUHINIA_SITE, HKCEC_NEW_WING_SITE } from '../../js/cities/hongkong/hkcec-architecture.js';
import { hongKongTerrainHeight as h } from '../../js/cities/hongkong/terrain.js';

const night = new URLSearchParams(location.search).has('night');
cityUniforms.uInteriorGlow.value = night ? 1.5 : 0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? 0x0f1520 : 0xb5cdd8);

// Build refined HKCEC complex including Golden Bauhinia Square
buildHkcec(scene, { groundOffset: 5 });

// Ground plane
const groundGeo = new THREE.PlaneGeometry(800, 800);
const groundMat = new THREE.MeshStandardMaterial({ color: night ? 0x161b22 : 0x424c56, roughness: 0.85 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(HKCEC_GOLDEN_BAUHINIA_SITE.x, 4.95, HKCEC_GOLDEN_BAUHINIA_SITE.z);
scene.add(ground);

// Lighting
const amb = new THREE.AmbientLight(night ? 0x223344 : 0x8899aa, night ? 0.7 : 1.2);
scene.add(amb);
const sun = new THREE.DirectionalLight(night ? 0x446688 : 0xfffaed, night ? 0.9 : 2.2);
sun.position.set(HKCEC_GOLDEN_BAUHINIA_SITE.x - 120, 160, HKCEC_GOLDEN_BAUHINIA_SITE.z - 180);
scene.add(sun);

// Camera target: Golden Bauhinia Square sculpture
const target = new THREE.Vector3(HKCEC_GOLDEN_BAUHINIA_SITE.x, 5 + 3.5, HKCEC_GOLDEN_BAUHINIA_SITE.z);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 2500);

let theta = 1.1, phi = 0.35, radius = 48;
function updateCam() {
  camera.position.x = target.x + radius * Math.sin(theta) * Math.cos(phi);
  camera.position.y = target.y + radius * Math.sin(phi);
  camera.position.z = target.z + radius * Math.cos(theta) * Math.cos(phi);
  camera.lookAt(target);
}
updateCam();

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

let dragging = false, prevX = 0, prevY = 0;
window.addEventListener('mousedown', e => { dragging = true; prevX = e.clientX; prevY = e.clientY; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  theta += (e.clientX - prevX) * 0.006;
  phi = Math.max(0.04, Math.min(1.3, phi + (e.clientY - prevY) * 0.006));
  prevX = e.clientX; prevY = e.clientY;
  updateCam();
});
window.addEventListener('mouseup', () => { dragging = false; });
window.addEventListener('wheel', e => {
  radius = Math.max(8, Math.min(300, radius + e.deltaY * 0.1));
  updateCam();
});
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  renderer.render(scene, camera);
});
</script>
