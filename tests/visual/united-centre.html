  #ui {

  }
  #ui h1 { margin: 0 0 6px; font-size: 16px; color: #3888d8; letter-spacing: 0.5px; }

<script type="importmap">{"imports":{"three":"../../vendor/three/build/three.webgpu.js","three/webgpu":"../../vendor/three/build/three.webgpu.js","three/tsl":"../../vendor/three/build/three.tsl.js","three/addons/":"../../vendor/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three/webgpu';
import { cityUniforms } from '../../js/tsl-materials.js';
import { buildUnitedCentre } from '../../js/cities/hongkong/united-centre-world.js';
import { buildAdmiraltyCentre } from '../../js/cities/hongkong/admiralty-centre-world.js';
import { buildFarEastFinanceCentre } from '../../js/cities/hongkong/far-east-finance-centre-world.js';
import { UNITED_CENTRE_SITE as S } from '../../js/cities/hongkong/united-centre-site.js';
import { hongKongTerrainHeight as h } from '../../js/cities/hongkong/terrain.js';

const night = new URLSearchParams(location.search).has('night');
cityUniforms.uInteriorGlow.value = night ? 1.5 : 0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? 0x0f1520 : 0xc7d8e5);

// Add United Centre
buildUnitedCentre(scene);

// Add neighbor Admiralty Centre & Far East Finance Centre
try {
  buildAdmiraltyCentre(scene);
  buildFarEastFinanceCentre(scene);
} catch (e) {
  console.warn('Neighbor building skipped:', e);
}

// Ground plane
const groundGeo = new THREE.PlaneGeometry(800, 800);
const groundMat = new THREE.MeshStandardMaterial({ color: night ? 0x181c22 : 0x48525c, roughness: 0.8 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(S.x, h(S.x, S.z) - 0.1, S.z);
scene.add(ground);

// Lighting
const amb = new THREE.AmbientLight(night ? 0x223344 : 0x8899aa, night ? 0.6 : 1.2);
scene.add(amb);
const dir = new THREE.DirectionalLight(night ? 0x446688 : 0xfffaed, night ? 0.8 : 2.0);
dir.position.set(S.x + 180, 260, S.z + 200);
scene.add(dir);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 2500);
camera.position.set(S.x + 110, h(S.x, S.z) + 90, S.z + 150);

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

let dragging = false, prevX = 0, prevY = 0;
let theta = 0.5, phi = 0.45, radius = 220;
const target = new THREE.Vector3(S.x, h(S.x, S.z) + 70, S.z);

function updateCam() {
  camera.position.x = target.x + radius * Math.sin(theta) * Math.cos(phi);
  camera.position.y = target.y + radius * Math.sin(phi);
  camera.position.z = target.z + radius * Math.cos(theta) * Math.cos(phi);
  camera.lookAt(target);
}
updateCam();

window.addEventListener('mousedown', e => { dragging = true; prevX = e.clientX; prevY = e.clientY; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  theta += (e.clientX - prevX) * 0.006;
  phi = Math.max(0.08, Math.min(1.2, phi + (e.clientY - prevY) * 0.006));
  prevX = e.clientX; prevY = e.clientY;
  updateCam();
});
window.addEventListener('mouseup', () => { dragging = false; });
window.addEventListener('wheel', e => {
  radius = Math.max(40, Math.min(600, radius + e.deltaY * 0.25));
  updateCam();
});
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  renderer.render(scene, camera);
});
</script>
