name: Fetch Hong Kong OSM data

on:
  push:
    branches:
      - arena/25d85531-rag-es
    paths:
      - .github/workflows/hk-osm-fetch.yml

permissions:
  contents: write

concurrency:
  group: hk-osm-fetch-arena-25d85531-rag-es
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/25d85531-rag-es
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the Geofabrik Hong Kong extract
        run: |
          curl --fail --location --retry 3 --retry-delay 5 --max-time 600 \
            --output tools/data/hongkong/hong-kong-latest.osm.pbf \
            https://download.geofabrik.de/asia/china/hong-kong-latest.osm.pbf
      - name: Record source provenance and checksum
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const file = 'tools/data/hongkong/hong-kong-latest.osm.pbf';
          const bytes = fs.readFileSync(file);
          if (bytes.length < 1000000) throw new Error('Hong Kong PBF is unexpectedly small');
          const manifest = {
            dataset: 'Geofabrik Hong Kong OSM extract',
            downloadUrl: 'https://download.geofabrik.de/asia/china/hong-kong-latest.osm.pbf',
            attribution: '© OpenStreetMap contributors',
            license: 'ODbL 1.0',
            retrievedAt: new Date().toISOString(),
            bytes: bytes.length,
            sha256: crypto.createHash('sha256').update(bytes).digest('hex')
          };
          fs.writeFileSync('tools/data/hongkong/source-manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(manifest);
          NODE
      - name: Commit the source extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/data/hongkong/hong-kong-latest.osm.pbf tools/data/hongkong/source-manifest.json
          git commit -m "chore: add Hong Kong OSM source extract"
          git push origin HEAD:arena/25d85531-rag-es
