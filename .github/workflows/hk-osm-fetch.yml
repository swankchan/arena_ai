name: Fetch Hong Kong OSM data

on:
  push:
    branches:
      - arena/25d85531-rag-es
    paths:
      - .github/workflows/hk-osm-fetch.yml

permissions:
  contents: write

concurrency:
  group: hk-osm-fetch-arena-25d85531-rag-es
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/25d85531-rag-es
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the public OSM layers
        env:
          GEO_REFRESH: 1
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { overpass } from './tools/geo/osm.mjs';
          import { coastlineQuery, landmarksQuery, parksQuery, roadQueries } from './tools/cities/hongkong/queries.mjs';
          const { default: cfg } = await import('./tools/cities/hongkong/config.mjs');
          const dataDir = path.resolve('tools/data/hongkong');
          for (const request of roadQueries(cfg.dataBounds)) {
            await overpass(request.query, path.join(dataDir, request.file));
          }
          for (const [query, file] of [
            [coastlineQuery(cfg.dataBounds), 'coastline.json'],
            [parksQuery(cfg.dataBounds), 'parks.json'],
            [landmarksQuery(cfg.dataBounds), 'landmarks.json']
          ]) {
            await overpass(query, path.join(dataDir, file));
          }
          NODE
      - name: Verify downloaded caches
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of fs.readdirSync('tools/data/hongkong').filter((file) => file.endsWith('.json'))) {
            const data = JSON.parse(fs.readFileSync(`tools/data/hongkong/${file}`, 'utf8'));
            if (!Array.isArray(data.elements) || !data.elements.length) throw new Error(`${file} is empty`);
            console.log(file, data.elements.length, data.osm3s?.timestamp_osm_base || 'no timestamp');
          }
          NODE
      - name: Commit the refreshed source cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data/hongkong
          if git diff --cached --quiet; then
            echo "OSM cache is unchanged"
            exit 0
          fi
          git commit -m "chore: refresh expanded Hong Kong OSM data"
          git push origin HEAD:arena/25d85531-rag-es
